# Nginx reverse proxy config for starnight.eitfaridabad.co.in
# Proxies to the Next.js app running on port 3015 (via PM2)
#
# Install:
#   sudo cp starnight.eitfaridabad.co.in.conf /etc/nginx/sites-available/starnight.eitfaridabad.co.in
#   sudo ln -s /etc/nginx/sites-available/starnight.eitfaridabad.co.in /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Then get an SSL cert (this handles the https block automatically):
#   sudo certbot --nginx -d starnight.eitfaridabad.co.in

server {
    listen 80;
    listen [::]:80;
    server_name starnight.eitfaridabad.co.in;

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets — cache aggressively, they're hashed by build
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3015;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 10M;
}
